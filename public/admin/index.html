<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>管理画面｜THE FOOL LINKS</title><link rel="stylesheet" href="/style.css"></head><body><main class="page"><header class="topbar"><a class="back" href="/">戻る</a><h1>管理画面</h1><span></span></header><section id="login" class="frame panel"><label class="field">管理キー<input id="key" type="password"></label><button id="loginButton" class="button primary">管理画面を開く</button><p id="loginNotice" class="notice"></p></section><section id="editor" class="hidden"><div class="frame panel"><label class="field">1段の配置数<select id="columns"><option value="3">3つ</option><option value="4">4つ</option></select></label><label class="field">要素認識コード<input id="code" readonly></label><label class="field">キャンペーン名<input id="name" maxlength="30"></label><label class="field">終了日<input id="endDate" type="date"></label><label class="field">抽選URL<input id="url" type="url"></label><div class="row"><button id="clear" class="button">入力を戻す</button><button id="save" class="button primary">保存する</button></div><p id="notice" class="notice"></p></div><div id="adminList" class="admin-list"></div></section></main><script src="/admin/admin.js" defer></script></body></html>
